<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hackathon 2K26 Project -- Ctrl Alt Elite</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #000000;
        margin: 0;
        padding: 0;
      }
      .title {
        color: #fff;
        text-align: center;
      }
      .description {
        color: #ddd;
        text-align: center;
      }
      .surprise-button {
        display: block;
        margin: 20px auto;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
      }
      .surprise-text {
        color: #ff0000;
        text-align: center;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <h1 class="title">Hackathon 2K26 Project -- Ctrl Alt Elite</h1>
    <p class="description">
      I will start to do work on this when Hackathon starts.
    </p>
    <div id="countdown" class="description" style="font-size: 20px; font-weight: bold; margin-top: 10px; color: #00ffcc;"></div>
    <button class="surprise-button" id="surprise-button">
      Click me for surprise
    </button>
    <p style="display: none" id="surprise-text" class="surprise-text">
      surprise
    </p>
    <script>
      // Target date: 31 July 2026 14:00 UTC+08:00
      const targetDate = new Date("2026-07-31T14:00:00+08:00").getTime();

      function updateCountdown() {
        const now = new Date().getTime();
        const difference = targetDate - now;

        if (difference < 0) {
          document.getElementById("countdown").innerText = "Started!";
          return;
        }

        const days = Math.floor(difference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("countdown").innerText = 
          `${days}d ${hours}h ${minutes}m ${seconds}s`;
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);

      document
        .querySelector("#surprise-button")
        .addEventListener("click", function () {
          document.querySelector("#surprise-text").style.display = "block";
          setTimeout(() => {
            document.querySelector("#surprise-text").style.display = "none";
          }, 1000);
        });
    </script>
  </body>
</html>
